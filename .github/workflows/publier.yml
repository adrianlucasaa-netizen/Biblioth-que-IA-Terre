name: Vérifier et publier le site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # l'historique sert à afficher les versions
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier les projets
        run: python outils/valider.py
      - name: Générer le site
        run: python outils/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: verifier
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
